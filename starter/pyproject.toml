[project]
name = "pinnlab"
version = "0.1.0"
description = "Minimal, readable PINN building blocks for the PINN Learning Path starter kit"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Classical solvers used as ground-truth generators (chapter 07).
solvers = ["scikit-fem>=10", "py-pde>=0.40"]
# A reference PINN library to compare your own code against (chapter 11/12).
deepxde = ["deepxde>=1.13"]

# uv only: on Linux/Windows pull CPU-only torch wheels (PyPI's default Linux build is the
# multi-GB CUDA one). macOS wheels on PyPI are already CPU-only. pip ignores this section.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinnlab"]

[tool.ruff]
line-length = 100
