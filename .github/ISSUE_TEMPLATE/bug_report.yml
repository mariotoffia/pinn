name: Bug in the hub, build, or labs
description: The page misbehaves, the build fails, or a lab does not run.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The hub page (index.html) - reading, search, progress
        - A guided tour or animation
        - The build (make generate)
        - A marimo lab in notebooks/
        - The starter kit in starter/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15 / Windows 11 / Ubuntu 24.04 - node --version - python --version - browser"
    validations:
      required: true
