name: release

# Cut a release by pushing a tag:   git tag v0.1.0 && git push origin v0.1.0
# This builds the hub, embeds it (plus starter/ and notebooks/) into the pinn
# binary for six OS/arch targets, and attaches binaries + checksums to a
# GitHub Release. Users then download ONE file and run it - no clone.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build + verify the hub, stage the payload
        run: |
          make pinn-assets
          node tools/verify.mjs dist/index.html

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: cross-compile
        run: make pinn-all VERSION="${GITHUB_REF_NAME}"

      - name: checksums
        run: cd dist/bin && sha256sum * > SHA256SUMS.txt

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/bin/* \
            --title "$GITHUB_REF_NAME" --generate-notes
